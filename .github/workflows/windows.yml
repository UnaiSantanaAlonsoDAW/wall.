name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Check out source
        id: source
        working-directory: ${{ runner.temp }}
        run: |
          # Windows cannot use the default workspace for the repository name "wall.".
          $directory = Join-Path $env:RUNNER_TEMP 'wall-source'
          git init --quiet $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $repository = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          git -C $directory fetch --quiet --depth=1 $repository $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $directory checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - name: Install Rust
        working-directory: ${{ steps.source.outputs.directory }}
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo fmt --all --check
      - name: Run tests
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo test --locked
      - name: Run Clippy
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build release executable
        if: github.event_name != 'pull_request'
        working-directory: ${{ steps.source.outputs.directory }}
        run: cargo build --release --locked
      - name: Package and verify
        if: github.event_name != 'pull_request'
        working-directory: ${{ steps.source.outputs.directory }}
        run: |
          ./tools/package.ps1
          python tools/check_binary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -match '^wall\.exe$|^wall-.+-windows-x64\.zip$' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              '{0}  {1}' -f $hash.ToLowerInvariant(), $_.Name
            } | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request'
        with:
          name: wall-windows-x64
          path: |
            ${{ steps.source.outputs.directory }}/dist/wall.exe
            ${{ steps.source.outputs.directory }}/dist/wall-*-windows-x64.zip
            ${{ steps.source.outputs.directory }}/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
