[package]
name = "wall"
version = "0.2.2"
edition = "2024"
description = "A quiet, native Windows wallpaper switcher"
license = "MIT"
repository = "https://github.com/UnaiSantanaAlonsoDAW/Wall"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.18"
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["UI_ViewManagement", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
